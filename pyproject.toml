[project]
name = "data-agent"
version = "0.1.0"
description = "Autonomous data agent: plain-language questions to grounded SQL answers, measured on BIRD Mini-Dev."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60",
    "sqlglot>=26.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH"]
ignore = [
    "S101",  # assert is fine in tests
    "S608",  # SQL strings are the point of this project; safety is enforced at execution time
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
